
<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>User Management</title>
      <link rel="stylesheet" href="styles/admin-dashboard.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">!!!!</div>

    <nav>
      <a href="1_overview.html">Overview</a>
      <a class="active" href="#">User Management</a>
      <a href="3_pet_records.html">Pet Records</a>
    </nav>

    <div class="admin-info">
      <span>Admin</span>
      <button id="logoutbtn">Logout</button>
    </div>
  </header>

  <main class="dashboard user-management">

    <section class="user-details">
      <h2 id="user">USER MANAGEMENT</h2>

      <p><strong>User ID:</strong> <span id="userId"></span></p>
      <p><strong>Email:</strong> <span id="userEmail"></span></p>
      <p><strong>Contact:</strong> <span id="userContact"></span></p>

      <h3>PETS</h3>
      <ul id="userPets"></ul>
    </section>

    <section class="user-table">

      <div class="controls">
        <input type="text" id="searchInput" placeholder="Search">
      </div>

   
      <table>
        <thead>
          <tr>
            <th>NAME</th>
            <th>USER ID</th>
            <th>EMAIL</th>
            <th>CONTACT NUMBER</th>
            <th># OF REGISTERED PETS</th>
            <th>MORE</th>
          </tr>
        </thead>

        <tbody id="userTableBody">
          <!-- js for users -->
        </tbody>
      </table>

    </section>

  </main>

  <script src="scripts/admin-dashboard.js"></script>
</body>
</html>
